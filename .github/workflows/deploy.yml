name: DREADNYX Telegram/WhatsApp test

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: dreadnyx-main
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_IDS: ${{ secrets.TELEGRAM_ADMIN_IDS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Node dependencies
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Validate JavaScript
        run: |
          find . -path './node_modules' -prune -o -path './stormbot/node_modules' -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Start application for manual test
        run: timeout 21000s npm start
