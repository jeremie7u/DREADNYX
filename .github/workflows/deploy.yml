name: DREADNYX Telegram/WhatsApp test

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: dreadnyx-main
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_IDS: ${{ secrets.TELEGRAM_ADMIN_IDS }}
      BOT_PROVIDER: ${{ secrets.BOT_PROVIDER || 'baileys' }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_PHONE_NUMBER_ID: ${{ secrets.META_PHONE_NUMBER_ID }}
      META_WABA_ID: ${{ secrets.META_WABA_ID }}
      META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION || 'v23.0' }}
      META_WEBHOOK_PORT: ${{ secrets.META_WEBHOOK_PORT || '3000' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg yt-dlp

      - name: Install Node dependencies
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Validate JavaScript
        run: |
          find . -path './node_modules' -prune -o -path './stormbot/node_modules' -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate Cloud API secret presence
        if: env.BOT_PROVIDER == 'cloud'
        run: |
          missing=0
          for name in META_ACCESS_TOKEN META_PHONE_NUMBER_ID META_VERIFY_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "Secret manquant: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo 'Secrets Cloud API requis détectés; leurs valeurs ne sont pas affichées.'

      - name: Start application for manual test
        run: |
          if [ "$BOT_PROVIDER" = "cloud" ]; then
            timeout 21000s npm run start:cloud
          else
            timeout 21000s npm start
          fi
